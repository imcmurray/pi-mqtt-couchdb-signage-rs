version: '3.8'

services:
  couchdb:
    image: couchdb:3.3
    container_name: signage-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - signage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: signage-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - signage-network
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 30s
      timeout: 10s
      retries: 3

  management-server:
    build: .
    container_name: signage-management
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - COUCHDB_URL=http://couchdb:5984
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - COUCHDB_USERNAME=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - signage-network
    depends_on:
      couchdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  signage-network:
    driver: bridge

volumes:
  couchdb_data:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:
  uploads:
  logs:
